<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova senha · FinTech Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="public.css" />
</head>
<body>
<main class="solo">
  <div class="solo-card">
    <!-- [ETAPA 2 · Frontend] Logo FinTech Flow (◈ + wordmark; estilos em theme.css .logo) -->
<a href="index.html" class="logo"><span class="logo-icon">◈</span><span class="logo-text">FinTech<em>Flow</em></span></a>

    <div class="card" id="cardForm">
      <div class="auth-title" style="margin-bottom:22px">
        <h1>Criar nova senha</h1>
        <p>Escolha uma senha com pelo menos 8 caracteres.</p>
      </div>
      <form class="auth-form" id="novaForm" novalidate>
        <div class="field">
          <label for="novaSenha">Nova senha</label>
          <input class="input" type="password" id="novaSenha" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="novaConf">Confirmar nova senha</label>
          <input class="input" type="password" id="novaConf" autocomplete="new-password" required />
          <span class="field-error" id="novaErr"></span>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Salvar nova senha</button>
      </form>
    </div>

    <div class="card hidden" id="cardOk">
      <div class="success-msg">
        <div class="success-icon">✓</div>
        <h2>Senha redefinida</h2>
        <p>Agora é só entrar com a nova senha.</p>
        <a class="btn btn-soft btn-block" href="login.html">Ir para o login</a>
      </div>
    </div>

    <a href="login.html" class="solo-back">← Voltar para o login</a>
  </div>
</main>

<script src="api.js"></script>
<script>
  (() => {
    const token = new URLSearchParams(window.location.search).get('token');
    const erro = document.getElementById('novaErr');
    const form = document.getElementById('novaForm');
    if (!token) erro.textContent = 'Link inválido. Solicite um novo em "Esqueci a senha".';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const senha = document.getElementById('novaSenha').value;
      const conf = document.getElementById('novaConf').value;
      if (senha.length < 8) { erro.textContent = 'A senha deve ter pelo menos 8 caracteres.'; return; }
      if (senha !== conf) { erro.textContent = 'As senhas não coincidem.'; return; }
      erro.textContent = '';
      const botao = form.querySelector('button[type="submit"]');
      botao.disabled = true;
      try {
        await api.post('/auth/redefinir-senha', { token, senha });
        document.getElementById('cardForm').classList.add('hidden');
        document.getElementById('cardOk').classList.remove('hidden');
      } catch (err) {
        erro.textContent = err.message;
      } finally {
        botao.disabled = false;
      }
    });
  })();
</script>
</body>
</html>
